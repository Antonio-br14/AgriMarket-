<text font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#666666" xml:space="preserve"><tspan x="944" y="509.6">El productor confirmara disponibilidad, flete y punto de entrega.</tspan></text>
